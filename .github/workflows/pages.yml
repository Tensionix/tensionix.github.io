name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # Profile, contribution calendar, repositories, releases and docs trees
      # in one GraphQL query; images and docs are copied into the build.
      # Fails on any error, so nothing is deployed.
      - name: Fetch from the GitHub API
        run: python3 scripts/fetch.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub turns off scheduled workflows after 60 days without repository
  # activity. Enabling this workflow through the API resets that clock.
  keep-schedule:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        run: |
          workflow="${GITHUB_WORKFLOW_REF%@*}"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/${workflow##*/}/enable"
        env:
          GH_TOKEN: ${{ github.token }}
